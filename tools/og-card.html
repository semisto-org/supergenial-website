<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Social card in the Super Génial design system: cream paper, black ink,
   one touch of violet, Geist and Geist Mono, the smiling cursor. */
* { margin:0; padding:0; box-sizing:border-box }
body { width:1200px; height:630px; overflow:hidden; position:relative;
  font-family:'Geist',system-ui,sans-serif; background:#f7f3ea; color:#1a1a1a;
  -webkit-font-smoothing:antialiased }
.txt { position:absolute; left:80px; top:72px; width:700px }
.brand { display:block; height:34px; aspect-ratio:92.32/13.29; background:#1a1a1a;
  -webkit-mask:url(/assets/brand/supergenial-logo.svg) left center/contain no-repeat;
  mask:url(/assets/brand/supergenial-logo.svg) left center/contain no-repeat; margin-bottom:56px }
h1 { font-size:68px; font-weight:700; letter-spacing:-.035em; line-height:1.02; text-wrap:balance }
h1::after { content:""; display:inline-block; width:.5em; height:.72em; margin-left:.08em; vertical-align:-.02em; background:#1a1a1a }
p { font-size:26px; line-height:36px; color:#5e5a53; margin-top:28px; text-wrap:pretty }
.url { position:absolute; left:80px; right:80px; bottom:0; height:72px; display:flex; align-items:center;
  border-top:1px solid #ddd6c8; font:500 16px/20px 'Geist Mono',monospace; letter-spacing:.08em; text-transform:uppercase; color:#5e5a53 }
.illu { position:absolute; right:64px; top:72px; width:380px; height:380px; object-fit:contain; mix-blend-mode:multiply }
</style></head><body>
<div class="txt"><span class="brand" aria-label="Super Génial"></span>
<h1 id="t"></h1><p id="s"></p></div>
<img class="illu" id="i" alt="">
<div class="url" id="u">supergenial.be · outils internes et agents IA sur mesure</div>
<script>
const p=new URLSearchParams(location.search);
document.getElementById('t').textContent=(p.get('t')||'').replace(/\*/g,'');
if(p.get('u')) document.getElementById('u').textContent='supergenial.be · '+p.get('u');
document.getElementById('s').textContent=p.get('s')||'';
const img=document.getElementById('i');
if(p.get('i')) img.src=p.get('i'); else img.remove();
</script></body></html>
